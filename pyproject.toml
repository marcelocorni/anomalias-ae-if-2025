[project]
name = "artigo-sbrc-2027"
version = "0.1.0"
description = "Comparação temporal de AE e IF sobre transações Ethereum de 2025"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.5.5",
  "numpy==2.5.3",
  "pyarrow==23.0.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
  "torch==2.14.0+cu130",
  "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
addopts = "-ra"
